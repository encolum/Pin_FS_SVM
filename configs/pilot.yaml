{
  "description": "Reduced scientific smoke pilot; not a manuscript result.",
  "datasets": ["diabetes"],
  "models": [
    "l2_svm",
    "l1_svm",
    "pin_svm",
    "budgeted_milp_svm",
    "fisher_l1_svm",
    "l1_svm_rfe",
    "pin_fs_svm"
  ],
  "conditions": ["clean"],
  "metrics": ["balanced_accuracy", "weighted_f1", "accuracy", "gmean"],
  "outer_folds": 2,
  "inner_folds": 2,
  "seeds": [42],
  "selection_tolerance": 1e-12,
  "C_grid": [1.0],
  "tau_grid": [0.5],
  "B_grid": [2],
  "model_grids": {
    "l1_svm_rfe": {"C": [1.0], "target_features": [2]}
  },
  "coefficient_bounds": {
    "lower": -2.0,
    "upper": 2.0,
    "provenance": "Preserved from the legacy implementation; the manuscript omits its claimed numeric bound values."
  },
  "solver": {"backend": "scipy", "threads": 1, "time_limit": 60.0, "mip_gap": 0.0, "max_iter": 2000},
  "parallelism": {"max_workers": 1, "allow_nested_parallelism": false},
  "corrupt_outer_test": false,
  "corruption": {},
  "corruption_qa": {
    "mixed": {
      "label_flip_rate": 0.1,
      "additive_rate": 0.01,
      "multiplicative_rate": 0.01,
      "additive_std": 0.1,
      "multiplicative_std": 0.1
    },
    "high_margin": {"flip_rate": 0.1, "reference_C": 1.0}
  },
  "statistics": {
    "enabled": false,
    "metric": "balanced_accuracy",
    "alternative": "greater",
    "zero_method": "wilcox",
    "method": "auto",
    "correction": "benjamini_hochberg",
    "alpha": 0.05,
    "pairing_unit": "outer_fold",
    "correction_family": "all_declared_pairwise_comparisons"
  },
  "output": {"root": "results_v2"}
}
