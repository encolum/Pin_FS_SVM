{
  "description": "Author-controlled z-only, v-only, and z+v ablation.",
  "datasets": ["diabetes"],
  "models": ["pinball_l1_svm", "pinball_cardinality_svm", "pin_fs_svm"],
  "conditions": ["clean"],
  "metrics": ["balanced_accuracy", "weighted_f1", "accuracy", "gmean"],
  "outer_folds": 5,
  "inner_folds": 3,
  "seeds": [42],
  "selection_tolerance": 1e-12,
  "C_grid": [0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32],
  "tau_grid": [0.1, 0.5, 1.0],
  "B_grid": "auto",
  "require_author_confirmation": true,
  "coefficient_bounds": {"lower": -2.0, "upper": 2.0, "author_confirmed": false, "provenance": "legacy implementation"},
  "solver": {"backend": "cplex", "threads": 1, "time_limit": null, "mip_gap": null},
  "parallelism": {"max_workers": 20, "allow_nested_parallelism": false},
  "corrupt_outer_test": false,
  "corruption": {},
  "statistics": {"enabled": false},
  "output": {"root": "results_v2"}
}
